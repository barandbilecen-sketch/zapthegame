<style>
:root{--sz:120px;--dot:#fff;--glow:rgba(255,255,255,.7);--bg1:#1b0a3c;--bg2:#0b3a5c;--fg:#fff;--panel:rgba(20,16,40,.92);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(20,16,40,.92)}}
:root[data-theme="dark"]{--panel:rgba(20,16,40,.92)}
html,body{height:100%;margin:0;overflow:hidden;background:#12082e;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--fg)}
#hint{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;transition:opacity .4s;padding:24px}
#hint img{width:112px;height:112px;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(255,255,255,.75))}
#hint h1{font-size:34px;margin:0 0 10px;letter-spacing:-.5px}
#hint p{margin:0;opacity:.7;font-size:17px}
.dot{position:fixed;left:0;top:0;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);border-radius:50%;background:var(--dotbg,var(--dot));box-shadow:0 0 calc(var(--sz)/3) calc(var(--sz)/12) var(--glow),0 0 calc(var(--sz)*.95) calc(var(--sz)/8) color-mix(in srgb,var(--glow) 42%,transparent);pointer-events:none;transform:scale(0);animation:pop .25s forwards,pulse 1s .25s infinite ease-in-out;transition:opacity .35s,transform .5s,width .25s,height .25s,margin .25s;will-change:transform,opacity}
.dot.bl{animation:none;opacity:1;transform:scale(1);transition:transform .17s cubic-bezier(.2,.9,.3,1.2),box-shadow .17s}
.dot.bl.big{transform:scale(1.32);box-shadow:0 0 calc(var(--sz)*.66) calc(var(--sz)*.22) var(--glow),0 0 calc(var(--sz)*1.5) calc(var(--sz)*.3) color-mix(in srgb,var(--glow) 40%,transparent)}
.dot.bl.off{transform:scale(.84);transition:transform .2s ease-in}
.dot.lose{animation:none;opacity:0;transform:scale(0)}
.dot.win{animation:none;transform:scale(1.5);box-shadow:0 0 calc(var(--sz)*.75) calc(var(--sz)*.25) var(--glow),0 0 calc(var(--sz)*1.6) calc(var(--sz)*.35) color-mix(in srgb,var(--glow) 45%,transparent)}
.ring{position:fixed;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);border-radius:50%;border:4px solid var(--dot);pointer-events:none;animation:ring 1s infinite}
@keyframes pop{to{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
body.won{animation:flash .6s}
@keyframes flash{from{background:var(--dot)}}
#gear{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:24px;color:#fff;touch-action:manipulation;transition:opacity .3s}
#gear.hide{opacity:0;pointer-events:none}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:85%;overflow-y:auto;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);box-sizing:border-box;transform:translateY(105%);transition:transform .35s;touch-action:pan-y;color:#fff}
#panel.open{transform:none}
#panel h2{margin:0 0 14px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.sec{margin-bottom:22px}
.sec h3{margin:0 0 10px;font-size:15px;opacity:.8;display:flex;align-items:center;gap:10px}
.prev{width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:inline-block}
label{display:block;font-size:12px;opacity:.6;margin:10px 0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;outline:none;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.35);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.35)}
.hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sw{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.sw button{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.5);padding:0;touch-action:manipulation}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border:2px solid transparent;border-radius:16px;padding:12px 10px;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;text-align:left;touch-action:manipulation}
.th.on{border-color:#fff}
.th i{flex:0 0 26px;height:26px;border-radius:50%;box-shadow:0 0 12px 2px var(--g)}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:14px;border-radius:14px;border:0;font-size:16px;font-weight:600;touch-action:manipulation}
#done{background:#fff;color:#111}
#reset{background:rgba(255,255,255,.15);color:#fff}

/* ===== Zap! modern görünüm ===== */
:root{--ff:'Outfit',-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;--ffd:'Unbounded','Outfit',-apple-system,system-ui,sans-serif}
html,body{font-family:var(--ff)}
body::before{content:"";position:fixed;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;
  background:radial-gradient(circle at 22% 28%,var(--glow) 0,transparent 24%),radial-gradient(circle at 78% 72%,rgba(120,90,255,.55) 0,transparent 22%),radial-gradient(circle at 70% 20%,rgba(255,80,170,.35) 0,transparent 18%);
  opacity:.22;animation:aur 38s linear infinite;will-change:transform}
@keyframes aur{to{transform:rotate(360deg)}}
#hint{gap:0}
#hint .mark{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
#hint .mark img{position:relative;width:118px;height:118px;margin:0;filter:drop-shadow(0 0 18px rgba(255,255,255,.8));animation:float 4s ease-in-out infinite}
#hint .r{position:absolute;inset:6px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);animation:rr 3s ease-out infinite}

@keyframes rr{from{transform:scale(.75);opacity:.8}to{transform:scale(1.9);opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
#hint h1{font-family:var(--ffd);font-weight:900;font-size:58px;letter-spacing:-2px;margin:0 0 10px;line-height:1;
  background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

#toast{z-index:100;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 68px);transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;font-family:var(--ffd);font-weight:900;font-size:clamp(15px,4.8vw,19px);letter-spacing:-.5px;padding:12px 22px;border-radius:999px;max-width:90vw;text-align:center;line-height:1.25;background:rgba(20,12,45,.82);border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 24px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:all .45s cubic-bezier(.2,.9,.3,1.3);}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#gear{width:50px;height:50px;font-size:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}

.sec h3{font-family:var(--ff);font-weight:600;font-size:14px;letter-spacing:.3px;text-transform:uppercase;opacity:.7}
.th{font-family:var(--ff);font-weight:600;font-size:15px;border-radius:20px;padding:14px 12px;border:1.5px solid rgba(255,255,255,.12)}
.th{position:relative}
.th.on{border-color:var(--g,#fff);box-shadow:0 0 0 2px var(--g,#fff),0 0 22px 4px var(--g,#fff);animation:thp 2s ease-in-out infinite}

@keyframes thp{50%{box-shadow:0 0 0 2px var(--g,#fff),0 0 34px 8px var(--g,#fff)}}
label{font-family:var(--ff);font-weight:500}
.btns button{font-family:var(--ff);border-radius:18px;font-weight:700}
#done{background:linear-gradient(135deg,#ffe46b,#ff5fa2);color:#1b0a3c}
#brand{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 12px);height:50px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(-16px) scale(.85);transform-origin:left center;pointer-events:none;transition:opacity .5s,transform .65s cubic-bezier(.2,.9,.3,1.25)}

function say(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show')}
function clr(f){f.el.classList.remove('bl','off','big')}
function ring(f){var r=document.createElement('div');r.className='ring';if(f.col)r.style.setProperty('--dot',f.col);r.style.left='0';r.style.top='0';r.style.translate=f.el.style.translate;document.body.appendChild(r)}
function mWin(f,rg){clr(f);f.el.classList.add('win');if(rg)ring(f);if(f.col)document.body.style.setProperty('--dot',f.col)}

var memU={};
function getU(k){try{var v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return memU[k]||[]}
function setU(k,v){memU[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* aynı soru bir daha çıkmaz: kullanılanlar kalıcı tutulur, hepsi bitince baştan karışır */
function nextQ(cat){
  if(OL.on&&OL.seed!==null){var A=CQ[cat].bank,j=rnd(A.length);return {t:A[j],left:0,fresh:false,on:1}}
  var arr=CQ[cat].bank,k='zap-u-'+cat+(CQ[cat].v||''),used=getU(k),left=[],i,fresh=false;
  for(i=0;i<arr.length;i++)if(used.indexOf(i)<0)left.push(i);
  if(!left.length){used=[];fresh=true;for(i=0;i<arr.length;i++)left.push(i)}
  i=left[rnd(left.length)];used.push(i);setU(k,used);
  return {t:arr[i],left:arr.length-used.length,fresh:fresh};
}

function wopts(){return wi.value.split(',').map(function(x){return x.trim()}).filter(Boolean).slice(0,12)}
function drawWheel(){
  var o=wopts(),n=Math.max(o.length,2),c=wc.getContext('2d'),sg=2*Math.PI/n;
  c.clearRect(0,0,640,640);
  for(var i=0;i<n;i++){
    c.beginPath();c.moveTo(320,320);c.arc(320,320,316,-Math.PI/2+i*sg,-Math.PI/2+(i+1)*sg);c.closePath();
    c.fillStyle='hsl('+(i*360/n+10)+',78%,56%)';c.fill();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=4;c.stroke();
    c.save();c.translate(320,320);c.rotate(-Math.PI/2+(i+.5)*sg);c.textAlign='right';c.fillStyle='#fff';
    c.font='700 36px Outfit,sans-serif';c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=6;c.fillText((o[i]||'?').slice(0,13),290,12);c.restore();
  }
  c.beginPath();c.arc(320,320,34,0,7);c.fillStyle='#fff';c.fill();
}

function pick(){
  var ids=Array.from(fingers.keys()),n=ids.length;
  phase='done';firstDone=true;stopTick();if(OL.on)OL.onDone();
  ids.forEach(function(id){clr(fingers.get(id))});
  if(mode==='ele')return runEle(ids);
  if(mode==='sise')return runBottle(ids);
  var sh=shuf(ids);
  if(mode==='zar'){var v=ids.map(function(){return rnd(6)+1}),mx=Math.max.apply(0,v),c=0;
    ids.forEach(function(id,i){var f=fingers.get(id),e=f.el;e.classList.add('num');e.textContent=v[i];if(v[i]===mx){ring(f);c++}else e.classList.add('dim')});
    sndWin();flash();say(c>1?'🎲 Beraberlik: '+mx:'🎲 En yüksek: '+mx);return}
  if(mode==='tac'){sh.forEach(function(id,i){var e=fingers.get(id).el;e.classList.add('num');e.textContent=i===0?'👑':i===n-1?'🐢':i+1});sndWin();flash();say('👑 Lider ve 🐢 son belli');return}
  if(mode==='sira'||mode==='takim'){
    var TC=['#ff4d6d','#3a86ff','#2ee59d'],L='ABC';
    sh.forEach(function(id,i){var e=fingers.get(id).el;e.classList.add('num');
      if(mode==='sira')e.textContent=i+1;
      else{var c=TC[i%TN];e.textContent=L[i%TN];e.style.setProperty('--dot',c);e.style.setProperty('--glow',c+'bb')}});
    sndWin();flash();say(mode==='sira'?'Sıralama hazır 🔢':'Takımlar hazır 🎨');return;
  }
  var k=mode==='coklu'?Math.max(1,Math.min(KN,n-1)):mode==='duello'?Math.min(2,n):1,win=sh.slice(0,k);
  ids.forEach(function(id){var f=fingers.get(id);if(win.indexOf(id)>=0)mWin(f,true);else mLose(f)});
  perf=OL.on&&sh.length?pidOf(sh[0]):null;
  sndWin();later(sndLose,250);flash();
  if(mode==='ters')say(LOSE[rnd(LOSE.length)]);
  else if(mode==='coklu')say(k+' kişi seçildi ✨');
  else if(mode==='duello')say('⚔️ Düello başlıyor!');
  else if(mode==='bomba')say(BOMB[rnd(BOMB.length)]);
  else if(mode==='ceza'){say(LOSE[rnd(LOSE.length)]);newTask();holdStart()}
  else if(mode==='dc'){say('Seçilen sensin 🎭');holdStart(true)}
  else if(CQ[mode]){say(CQ[mode].say);newTask();holdStart()}
  else showToast();
}
function runEle(ids){
  var o=shuf(ids),i=0;
  (function step(){
    if(o.length-i<=1){mWin(fingers.get(o[o.length-1]),true);sndWin();flash();say('Son kalan sensin! 🏁');return}
    mLose(fingers.get(o[i++]));sndDown(Math.max(1,o.length-i));say((o.length-i)+' kişi kaldı');later(step,900);
  })();
}
function labelDot(f,t){clr(f);f.el.classList.add('num','lab');f.el.textContent=t;ring(f)}
function runBottle(ids){
  var cx=0,cy=0;ids.forEach(function(id){var f=fingers.get(id);cx+=f.x;cy+=f.y});cx/=ids.length;cy/=ids.length;
  var ask=ids[rnd(ids.length)],af=fingers.get(ask),ang=Math.atan2(af.y-cy,af.x-cx)*180/Math.PI;
  var back=ang+180,ans=null,bd=999;
  ids.forEach(function(id){if(id===ask)return;var f=fingers.get(id),g=Math.atan2(f.y-cy,f.x-cx)*180/Math.PI,d=Math.abs(((g-back+540)%360)-180);if(d<bd){bd=d;ans=id}});
  bottle.style.left=cx+'px';bottle.style.top=cy+'px';bottle.classList.add('show');
  bottle.animate([{transform:'rotate(0deg)'},{transform:'rotate('+(1800+ang)+'deg)'}],{duration:4200,easing:'cubic-bezier(.12,.7,.1,1)',fill:'forwards'});
  for(var k=1;k<=26;k++)(function(k){later(function(){play('pop1','A')},4000*Math.pow(k/26,1.7))})(k);
  later(function(){ids.forEach(function(id){var f=fingers.get(id);if(id===ask)labelDot(f,'SOR');else if(id===ans)labelDot(f,'CEVAPLA');else mLose(f)});sndWin();flash();say('🍾 Şişe karar verdi!')},4400);
}

var hT=null,hStart=0,hTarget=0;
function startHedef(){
  phase='hedef';hStart=Date.now();hTarget=(8+rnd(17))/2;
  say('🎯 Hedef süre: '+hTarget.toFixed(1)+' sn');
  fingers.forEach(function(f){var e=document.createElement('em');e.className='tl';e.textContent='0.0';f.el.appendChild(e);f.tl=e;f.done=false});
  hT=setInterval(function(){var t=((Date.now()-hStart)/1000).toFixed(1);fingers.forEach(function(f){if(!f.done)f.tl.textContent=t})},50);
}
function hedefRelease(f){
  f.done=true;f.t=(Date.now()-hStart)/1000;f.tl.textContent=f.t.toFixed(2);f.el.classList.add('rel');
  var all=true;fingers.forEach(function(g){if(!g.done)all=false});
  if(all)hedefFinish();
}
function hedefFinish(){
  clearInterval(hT);phase='done';
  var best=null,bd=1e9;fingers.forEach(function(f){var d=Math.abs(f.t-hTarget);f.d=d;if(d<bd){bd=d;best=f}});
  fingers.forEach(function(f){f.tl.textContent=(f===best?'🏆 ':'')+f.t.toFixed(2)+' ('+(f.t>=hTarget?'+':'−')+f.d.toFixed(2)+')';if(f===best){f.el.classList.remove('rel');mWin(f,true)}});
  sndWin();flash();say('🏆 Kazanan hedefe '+bd.toFixed(2)+' sn yaklaştı');
  later(reset,6000);
}

OL.bcast=function(m,except){Object.keys(OL.conns).forEach(function(id){if(id===except)return;var c=OL.conns[id];try{if(c.open)c.send(m)}catch(e){}})};
OL.out=function(m){if(OL.host){m.p=OL.selfId;OL.bcast(m)}else if(OLC&&OLC.open){try{OLC.send(m)}catch(e){}}};
OL.hue=function(f){var m=f.col&&/hsl\((\d+)/.exec(f.col);return m?+m[1]:null};
OL.send=function(k,id,f){
  if(!OL.on)return;
  var m={t:'f',k:k,id:id};
  if(f){m.x=+(f.x/innerWidth).toFixed(4);m.y=+(f.y/innerHeight).toFixed(4);OL.lp[id]=[f.x,f.y];if(k==='d'){var h=OL.hue(f);if(h!==null)m.h=h}}
  OL.out(m);
};

setInterval(function(){
  if(!OL.on)return;
  for(var id in OL.pend){var f=OL.pend[id];delete OL.pend[id];if(fingers.get(+id)===f)OL.send('m',+id,f)}
  fingers.forEach(function(f){if(f.nm&&f.nm.parentNode!==f.el)f.el.appendChild(f.nm)});

OL.refresh=function(){
  var l=[{id:OL.selfId,n:OL.myn}];

  OL.setRoster(l);
};

/* --- uzaktaki parmaklar --- */
OL.loc=function(ck){var p=OL.selfId+'#';return ck.indexOf(p)===0?Number(ck.slice(p.length)):ck};
OL.canon=function(k){return typeof k==='number'?OL.selfId+'#'+k:k};
OL.place=function(f,ev){pos(f,{clientX:ev.x*innerWidth,clientY:ev.y*innerHeight})};
OL.mkRemote=function(key,p,x,y,h){
  var el=document.createElement('div');el.className='dot';document.body.appendChild(el);
  var f={el:el,remote:true,pid:p};
  if(typeof h==='number'&&h===h){f.col='hsl('+h+',100%,58%)';el.style.setProperty('--dot',f.col);el.style.setProperty('--glow','hsla('+h+',100%,58%,.75)')}
  var nm=document.createElement('span');nm.className='nm';nm.textContent=pname(p);el.appendChild(nm);f.nm=nm;
  OL.place(f,{x:x,y:y});fingers.set(key,f);return f;
};
OL.mkLocal=function(id){
  var el=document.createElement('div');el.className='dot';document.body.appendChild(el);
  var f={el:el},q=OL.lp[id]||[innerWidth/2,innerHeight/2];pos(f,{clientX:q[0],clientY:q[1]});fingers.set(id,f);return f;
};
OL.rm=function(key){var f=fingers.get(key);if(f){f.el.remove();fingers.delete(key)}};
OL.apply=function(ev){
  if(!ev||ev.p===OL.selfId||typeof ev.id!=='number')return;
  var key=ev.p+'#'+ev.id;
  if(ev.k==='m'){var g=fingers.get(key);if(g&&phase!=='done')OL.place(g,ev);return}
  if(phase==='done'||phase==='hedef'){OL.q.push(ev);return}
  if(OL.locked)return;
  if(ev.k==='d'){
    if(fingers.has(key))return;
    OL.mkRemote(key,ev.p,ev.x,ev.y,ev.h);sndDown(fingers.size);setHint(false);schedule();
  }else if(ev.k==='u'){
    if(!fingers.has(key))return;
    OL.rm(key);if(fingers.size===0)reset();else schedule();
  }
};
OL.drop=function(pid){
  if(OL.locked||phase==='done')return;
  var ks=[];fingers.forEach(function(f,k){if(typeof k==='string'&&k.indexOf(pid+'#')===0)ks.push(k)});
  if(!ks.length)return;
  ks.forEach(OL.rm);if(fingers.size===0)reset();else schedule();
};
OL.flush=function(){if(!OL.q.length)return;var q=OL.q;OL.q=[];q.forEach(function(e){OL.apply(e)})};

/* --- tur başlatma (ev sahibi karar verir, herkes aynı tohumla oynar) --- */
OL.reorder=function(order){
  var old=new Map(fingers);fingers.clear();
  order.forEach(function(ck){
    var lk=OL.loc(ck),f=old.get(lk);
    if(!f){var pid=typeof lk==='number'?OL.selfId:ck.split('#')[0];f=typeof lk==='number'?OL.mkLocal(lk):OL.mkRemote(lk,pid,.5,.5);fingers.delete(lk)}
    fingers.set(lk,f);
  });
  old.forEach(function(f,k){if(!fingers.has(k))f.el.remove()});
};
OL.begin=function(){
  var order=[];fingers.forEach(function(f,k){order.push(OL.canon(k))});order.sort();
  var a=new Uint32Array(1);try{crypto.getRandomValues(a)}catch(e){a[0]=Math.floor(Math.random()*4294967295)}
  OL.reorder(order);OL.seed=a[0]|0;OL.locked=true;
  OL.bcast({t:'go',seed:OL.seed,order:order,mode:mode,KN:KN,TN:TN});
};
OL.onGo=function(m){
  if(OL.locked||!m||!m.order||m.order.length<1)return;
  if(phase==='done')reset();
  clearTimer();
  var eff=m.mode;
  if(is18(eff)&&ageGet()!=='ok')eff='tek';
  if(eff!==m.mode||mode!==eff){OL.prevMode=mode;mode=eff}
  KN=m.KN||KN;TN=m.TN||TN;
  OL.reorder(m.order);OL.seed=m.seed|0;OL.locked=true;
  updateSize();setHint(false);startBlink();
};
OL.onDone=function(){
  clearTimeout(OL.dt);
  OL.dt=setTimeout(function(){if(OL.on&&phase==='done'&&!hold&&OL.ld===0)reset()},12000);
};
OL.votes={};OL.vc=null;
OL.restrict=function(){return !!perf&&OL.players.length>1&&OL.players.some(function(p){return p.id===perf})};
OL.canChoose=function(id){return !OL.restrict()||id===perf};

  if(OL.host)OL.popVote(OL.selfId,a);
  else if(OLC&&OLC.open){try{OLC.send({t:'pop',a:a})}catch(e){}say('🗳️ Oyun verildi')}
};
OL.popVote=function(pid,a){
  if(!popEl.classList.contains('show'))return;
  var isCh=a==='dog'||a==='ces',ch=!!popEl.querySelector('[data-a=dog]');
  if(isCh!==ch)return;
  if(isCh){if(!OL.canChoose(pid))return;OL.popDo(a);OL.bcast({t:'pop',a:a});return}
  if(a!=='ok'&&a!=='pas'&&a!=='yeni')return;

  Object.keys(OL.votes).forEach(function(k){if(ids.indexOf(k)>=0)cnt[OL.votes[k]]++});
  var need=OL.restrict()?Math.floor(ids.length/2)+1:1;
  ['ok','pas','yeni'].forEach(function(x){if(cnt[x]>=need)win=x});
  if(win){OL.popDo(win);OL.bcast({t:'pop',a:win})}
  else{OL.vc={ok:cnt.ok,pas:cnt.pas,yeni:cnt.yeni,need:need};OL.popRole();OL.bcast({t:'pv',c:cnt,n:need})}
};
OL.popDo=function(a){
  if(a!=='ok'&&a!=='pas'&&a!=='yeni'&&a!=='dog'&&a!=='ces')return;

/* online: görevi yapan kişi soruyu/görevi kendi geçemez; diğer oyuncular onaylar (çoğunluk) */
OL.popRole=function(){
  if(!OL.on||!OL.restrict())return;
  var b=popEl.querySelector('b'),ch=!!popEl.querySelector('[data-a=dog]'),me=OL.selfId,nm=pname(perf),

    Array.prototype.forEach.call(popEl.querySelectorAll('button'),function(x){var a=x.getAttribute('data-a');x.textContent=L[a]+(c&&c[a]?' '+c[a]+'/'+c.need:'')});
  }

function netMode(m){
  if(!m||!mInfo(m.m))return;

/* --- ev sahibi --- */
function onHost(c,m){
  var pid=c.peer;if(!m||typeof m!=='object')return;
  if(m.t==='hi'){
    if(OL.pl[pid])return;
    if(Object.keys(OL.pl).length>=7){try{c.send({t:'bye',why:'Oda dolu (en fazla 8 kişi)'})}catch(e){}setTimeout(function(){try{c.close()}catch(e){}},400);return}
    var n=String(m.n||'Oyuncu').replace(/[<>&]/g,'').trim().slice(0,12)||'Oyuncu';
    OL.pl[pid]={n:n,c:c};OL.conns[pid]=c;OL.refresh();
    try{c.send({t:'welcome',you:pid,host:OL.selfId,players:OL.players,mode:mode,KN:KN,TN:TN})}catch(e){}
    OL.bcast({t:'roster',players:OL.players},pid);say('🌐 '+n+' katıldı');
  }else if(!OL.pl[pid]){return}
  else if(m.t==='f'){
    if(m.k!=='d'&&m.k!=='m'&&m.k!=='u')return;
    if(typeof m.id!=='number'||m.id!==m.id)return;
    var ev={t:'f',k:m.k,id:m.id,p:pid};
    if(m.k!=='u'){ev.x=Math.max(0,Math.min(1,+m.x||0));ev.y=Math.max(0,Math.min(1,+m.y||0));if(typeof m.h==='number')ev.h=m.h}
    OL.bcast(ev,pid);OL.apply(ev);
  }else if(m.t==='pop'){
    if(typeof m.a==='string')OL.popVote(pid,m.a);
  }
}
function dropConn(c){
  var pid=c.peer,p=OL.pl[pid];if(!p)return;
  delete OL.pl[pid];delete OL.conns[pid];OL.refresh();
  OL.bcast({t:'roster',players:OL.players});OL.bcast({t:'gone',p:pid});OL.drop(pid);say('🌐 '+p.n+' ayrıldı');
}
function hostStart(p){
  p.on('connection',function(c){
    c.on('data',function(m){onHost(c,m)});
    c.on('close',function(){dropConn(c)});
    c.on('error',function(){dropConn(c)});
  });
  p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
  p.on('error',function(er){if(er&&er.type!=='peer-unavailable')OL.msg('Bağlantı sorunu: '+(er.type||'bilinmiyor'),true)});
}
OL.fail=function(er,p){
  var t=er&&er.type,msg=t==='peer-unavailable'?'Oda bulunamadı. Kodu kontrol et.':
    (t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')?'Bağlantı sunucusuna ulaşılamadı. İnternetini kontrol et.':
    t==='load'?'İnternet gerekli. Bağlantını kontrol et.':'Bağlantı kurulamadı'+(t?' ('+t+')':'');
  try{if(p)p.destroy()}catch(e){}
  OLP=null;OLC=null;OL.on=false;OL.host=false;OL.ui();OL.msg(msg,true);
};
OL.create=function(){
  if(OL.on)return;
  var nm=OL.myName();OL.msg('Bağlanılıyor…');
  loadPeer(function(e){
    if(e)return OL.fail({type:'load'});
    var tries=0;
    (function mk(){
      var code=code5(),p=new Peer('zapgame-'+code,peerOpts()),opened=false;
      p.on('open',function(id){
        opened=true;OLP=p;OL.on=true;OL.host=true;OL.code=code;OL.selfId=id;OL.hostId=id;OL.myn=nm;OL.pl={};OL.conns={};OL.q=[];
        if(OLBLOCK[mode])setMode('tek');
        OL.refresh();OL.msg('');hostStart(p);
      });
      p.on('error',function(er){
        if(opened)return;
        if(er&&er.type==='unavailable-id'&&tries++<4){try{p.destroy()}catch(x){}return mk()}
        OL.fail(er,p);
      });
    })();
  });
};
OL.join=function(code){
  if(OL.on)return;
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4)return OL.msg('Oda kodunu gir.',true);
  var nm=OL.myName();OL.msg('Bağlanılıyor…');
  loadPeer(function(e){
    if(e)return OL.fail({type:'load'});
    var p=new Peer(peerOpts()),done=false,to=null;
    function bad(er){if(done)return;done=true;clearTimeout(to);OL.fail(er,p)}
    p.on('error',bad);
    p.on('open',function(id){
      var c=p.connect('zapgame-'+code,{reliable:true,serialization:'json'});
      to=setTimeout(function(){bad({type:'timeout'})},15000);
      c.on('open',function(){
        if(done)return;done=true;clearTimeout(to);
        OLP=p;OLC=c;OL.on=true;OL.host=false;OL.code=code;OL.selfId=id;OL.q=[];OL.myn=nm;
        c.send({t:'hi',n:nm});
      });
      c.on('data',onGuest);
      c.on('close',function(){if(OL.on)OL.leave('Oda kapandı.')});
      c.on('error',function(){if(OL.on)OL.leave('Bağlantı koptu.')});
    });
  });
};
OL.leave=function(why){
  clearTimeout(OL.dt);
  if(OLC){try{OLC.close()}catch(e){}OLC=null}
  Object.keys(OL.conns).forEach(function(id){try{OL.conns[id].close()}catch(e){}});OL.conns={};OL.pl={};
  if(OLP){try{OLP.destroy()}catch(e){}OLP=null}
  var was=OL.on;OL.on=false;OL.host=false;OL.locked=false;OL.seed=null;OL.players=[];OL.names={};OL.q=[];OL.pend={};
  if(was)reset();
  OL.ui(why);
  if(why)openOnline();
};

/* --- konuk --- */
function onGuest(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'welcome':OL.hostId=m.host;OL.setRoster(m.players||[]);netMode(m);OL.msg('');openOnline();break;
    case 'roster':OL.setRoster(m.players||[]);break;
    case 'f':OL.apply(m);break;
    case 'go':OL.onGo(m);break;
    case 'mode':netMode(m);break;
    case 'pop':OL.popDo(m.a);break;
    case 'pv':if(m.c&&+m.n>0){OL.vc={ok:+m.c.ok||0,pas:+m.c.pas||0,yeni:+m.c.yeni||0,need:+m.n};OL.popRole()}break;
    case 'gone':OL.drop(m.p);break;
    case 'bye':OL.leave(m.why||'Odadan çıkarıldın.');break;
  }
}

function end(e){
