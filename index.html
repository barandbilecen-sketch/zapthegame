#dock button.main{background:linear-gradient(135deg,rgba(255,95,162,.9),rgba(58,134,255,.9));box-shadow:0 4px 16px rgba(255,95,162,.35)}
body:has(.dot) #dock,body:has(.ring) #dock{opacity:0;pointer-events:none;transform:translateY(14px)}
#mhint{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
#card{bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}

/* üst menü: ayarlar + profil */
#hdr #foot,#hdr #gear{display:none!important}
#hdr .hb{pointer-events:auto;display:flex;align-items:center;gap:7px;height:46px;padding:0 16px 0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:700 14px var(--ff);transition:opacity .3s,transform .15s}
#hdr .hb i{font-style:normal;font-size:19px;line-height:1}
#hdr .hb:active{transform:scale(.94)}
#hdr .hb.pr{background:linear-gradient(135deg,rgba(255,95,162,.85),rgba(58,134,255,.85));border-color:rgba(255,255,255,.3)}
body:has(.dot) #hdr .hb,body:has(.ring) #hdr .hb{opacity:0;pointer-events:none}
#zs{position:fixed;inset:0;z-index:99;display:none;align-items:flex-end;justify-content:center;background:rgba(5,2,18,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
#zs.show{display:flex}
#zs .sh{width:100%;max-width:520px;max-height:88%;overflow-y:auto;box-sizing:border-box;padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 22px);border-radius:28px 28px 0 0;background:linear-gradient(160deg,#241050,#0d2a4a);border:1px solid rgba(255,255,255,.15);border-bottom:0;box-shadow:0 -12px 50px rgba(0,0,0,.5);animation:zsUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes zsUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#zs .gr{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:0 auto 14px}
#zs .tb{display:flex;gap:6px;padding:4px;border-radius:16px;background:rgba(255,255,255,.1);margin-bottom:16px}
#zs .tb button{flex:1;height:38px;border:0;border-radius:12px;background:transparent;color:#fff;font:700 14px var(--ff);opacity:.75}
#zs .tb button.on{background:rgba(255,255,255,.2);opacity:1}
#zs h3{margin:0 0 10px;font:900 13px var(--ffd);letter-spacing:1px;color:#ffe46b}
#zs .av{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start;margin-bottom:16px}
#zs .av>*{width:100%;min-width:0;aspect-ratio:1/1;height:auto;box-sizing:border-box}
#zs .av button{aspect-ratio:1;border:2px solid transparent;border-radius:16px;background:rgba(255,255,255,.1);font-size:28px;line-height:1}
#zs .av button.on{border-color:#ffe46b;background:rgba(255,228,107,.18)}
#zs input[type=text]{width:100%;box-sizing:border-box;height:48px;padding:0 16px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:600 16px var(--ff);outline:none;margin-bottom:16px;-webkit-user-select:text;user-select:text}
#zs .st{display:flex;gap:10px;margin-bottom:6px}
#zs .st div{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:84px;padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.1);text-align:center}
#zs .st b{display:block;font:900 24px var(--ffd);margin-bottom:4px}
#zs .st small{font:500 12px var(--ff);opacity:.75}
#zs .rw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;box-sizing:border-box;padding:14px 16px;margin-bottom:8px;border:0;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font:600 16px var(--ff);text-align:left;text-decoration:none}
#zs .lg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}#zs .lg button{padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:600 14px var(--ff);touch-action:manipulation}#zs .lg button.on{background:#ffe46b;color:#1b0a3c;border-color:#ffe46b}
#zs .rw small{font:500 12px var(--ff);opacity:.65;display:block;margin-top:2px}
#zs .tgl{position:relative;flex:none;width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.22);transition:background .2s}
#zs .tgl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
#zs .rw.on .tgl{background:#2ee59d}#zs .rw.on .tgl::after{transform:translateX(20px)}
#zs .ft2{text-align:center;font:500 12px var(--ff);opacity:.55;margin-top:12px}

#hdr .hb.pr{height:60px;padding:0 20px 0 6px;gap:10px;font-size:15px}
#hdr .hb.pr .hpa{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.35);background:#12082e}
#hdr .hb.pr span{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zs .big{display:flex;flex-direction:column;align-items:center;gap:10px;margin:2px 0 18px}
#zs .big .bigp{width:116px;height:116px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.1)}
#zs .big b{font:900 20px var(--ffd)}
#zs .av button{padding:0;overflow:hidden;border-radius:50%}
#zs .av button img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
#zs .av button.on{border-color:#ffe46b;box-shadow:0 0 0 3px rgba(255,228,107,.25)}
#zs .av .up{overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed rgba(255,255,255,.4);border-radius:50%;background:rgba(255,255,255,.08);text-align:center;cursor:pointer}
#zs .av .up small{font:600 9px var(--ff);opacity:.85;line-height:1.1;padding:0 6px}

/* mod seçici (basılı tut + kaydır) */
#mpb{position:fixed;inset:0;z-index:86;display:none;background:radial-gradient(120% 60% at 50% 100%,rgba(58,134,255,.28),rgba(8,4,28,.72));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;transition:opacity .25s}
#mpb.show{display:block;opacity:1}
#mp2{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:87;display:none;flex-direction:column;align-items:center;opacity:0;transform:translateY(18px) scale(.97);transition:opacity .22s,transform .22s;touch-action:pan-x}
#mp2.show{display:flex;opacity:1;transform:none}
#mp2 .mpx{display:flex;align-items:center;gap:12px;margin-bottom:34px;position:relative;z-index:2;font:700 11px var(--ff);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.75)}
#mp2 .mpx button{pointer-events:auto;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;border-radius:99px;padding:5px 12px;font:700 11px var(--ff);letter-spacing:.06em}
#mpc{width:100%;display:flex;gap:10px;overflow-x:auto;padding:60px calc(50% - 56px) 60px;margin:-46px 0 -34px;box-sizing:border-box;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;perspective:700px}
#mpc::-webkit-scrollbar{display:none}
#mpc .mq{box-shadow:none;position:relative;flex:none;width:112px;height:150px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);color:#fff;transition:border-color .2s;will-change:transform,opacity}
#mpc .mq i{font-style:normal;font-size:46px;line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
#mpc .mq b{font:900 12.5px var(--ffd);letter-spacing:-.3px;text-align:center;padding:0 6px;line-height:1.15}
#mpc .mq.c{border-color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08))}
#mpc .mq.cur::after{content:"SEÇİLİ";position:absolute;top:10px;left:0;right:0;text-align:center;font:800 8.5px var(--ff);letter-spacing:.16em;color:#ffe46b}
#mpc .mq.off{filter:grayscale(1)}
#mpd{max-width:82%;text-align:center;font:500 13.5px/1.35 var(--ff);color:rgba(255,255,255,.88);min-height:36px;margin-top:-6px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#mpg{position:absolute;left:50%;top:38px;width:min(120vw,560px);height:340px;margin-left:calc(min(120vw,560px)/-2);pointer-events:none;background:radial-gradient(closest-side,rgba(255,95,162,.55),rgba(112,70,255,.32) 45%,rgba(58,134,255,.12) 72%,transparent);filter:blur(10px);animation:mpgp 3s ease-in-out infinite}
@keyframes mpgp{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
#mp2>*:not(#mpg){position:relative}
#dk3.pulse{animation:dkp 2.2s ease-in-out infinite}
@keyframes dkp{0%,100%{box-shadow:0 4px 16px rgba(255,95,162,.35)}50%{box-shadow:0 0 0 7px rgba(255,95,162,.18),0 4px 22px rgba(255,95,162,.6)}}
#dock.hold{z-index:88}
body:has(#mp2.show) #hint,body:has(#mp2.show) #hdr{visibility:hidden}
</style>

function clearTimer(){stopTick();if(timer){clearTimeout(timer);timer=null}}

/* Parmak sayısı arttıkça küreler küçülür, hepsi ekrana sığar (10 parmağa kadar) */
function updateSize(){
  var n=fingers.size,sz=n<=3?120:n<=5?104:n<=7?88:n<=9?78:70;
  document.documentElement.style.setProperty('--sz',sz+'px');
}
function schedule(){
  updateSize();if(OL.on&&OL.locked)return;
  if(phase==='done'||phase==='hedef')return;
  clearTimer();
  fingers.forEach(function(f){f.el.classList.remove('bl','off','big')});
  if(fingers.size<2){phase='idle';setHint(fingers.size===0);return}
  phase='waiting';if(OL.on&&!OL.host)return;timer=setTimeout(startBlink,2500);
}
function startBlink(){
  if(OL.on&&OL.host&&!OL.locked)OL.begin();
  if(mode==='hedef'){startHedef();return}
  phase='blinking';
  fingers.forEach(function(f){f.el.classList.add('bl')});
  startTick();
  timer=setTimeout(pick,1800+rnd(1200));
}

function onHost(c,m){
  var pid=c.peer;if(!m||typeof m!=='object')return;
  if(m.t==='hi'){
    if(OL.pl[pid])return;
    if(Object.keys(OL.pl).length>=7){try{c.send({t:'bye',why:'Oda dolu (en fazla 8 kişi)'})}catch(e){}setTimeout(function(){try{c.close()}catch(e){}},400);return}
    var n=String(m.n||'Oyuncu').replace(/[<>&]/g,'').trim().slice(0,12)||T('Oyuncu');
    OL.pl[pid]={n:n,c:c};OL.conns[pid]=c;OL.refresh();
    try{c.send({t:'welcome',you:pid,host:OL.selfId,players:OL.players,mode:mode,KN:KN,TN:TN})}catch(e){}
    OL.bcast({t:'roster',players:OL.players},pid);say('🌐 '+n+' katıldı');
  }else if(!OL.pl[pid]){return}
  else if(m.t==='f'){
    if(m.k!=='d'&&m.k!=='m'&&m.k!=='u')return;
    if(typeof m.id!=='number'||m.id!==m.id)return;
    var ev={t:'f',k:m.k,id:m.id,p:pid};
    if(m.k!=='u'){ev.x=Math.max(0,Math.min(1,+m.x||0));ev.y=Math.max(0,Math.min(1,+m.y||0));if(typeof m.h==='number')ev.h=m.h}
    OL.bcast(ev,pid);OL.apply(ev);
  }else if(m.t==='pop'){
    if(typeof m.a==='string')OL.popVote(pid,m.a);
  }
}
function dropConn(c){
  var pid=c.peer,p=OL.pl[pid];if(!p)return;
  delete OL.pl[pid];delete OL.conns[pid];OL.refresh();
  OL.bcast({t:'roster',players:OL.players});OL.bcast({t:'gone',p:pid});OL.drop(pid);say('🌐 '+p.n+' ayrıldı');
}
function hostStart(p){
  p.on('connection',function(c){
    c.on('data',function(m){onHost(c,m)});
    c.on('close',function(){dropConn(c)});
    c.on('error',function(){dropConn(c)});
  });
  p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
  p.on('error',function(er){if(er&&er.type!=='peer-unavailable')OL.msg('Bağlantı sorunu: '+(er.type||'bilinmiyor'),true)});
}
OL.fail=function(er,p){
  var t=er&&er.type,msg=t==='peer-unavailable'?'Oda bulunamadı. Kodu kontrol et.':
    (t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')?'Bağlantı sunucusuna ulaşılamadı. İnternetini kontrol et.':
    t==='load'?'İnternet gerekli. Bağlantını kontrol et.':'Bağlantı kurulamadı'+(t?' ('+t+')':'');
  try{if(p)p.destroy()}catch(e){}
  OLP=null;OLC=null;OL.on=false;OL.host=false;OL.ui();OL.msg(msg,true);
};
OL.create=function(){
  if(OL.on)return;
  var nm=OL.myName();OL.msg('Bağlanılıyor…');
  loadPeer(function(e){
    if(e)return OL.fail({type:'load'});
    var tries=0;
    (function mk(){
      var code=code5(),p=new Peer('zapgame-'+code,peerOpts()),opened=false;
      p.on('open',function(id){
        opened=true;OLP=p;OL.on=true;OL.host=true;OL.code=code;OL.selfId=id;OL.hostId=id;OL.myn=nm;OL.pl={};OL.conns={};OL.q=[];
        if(OLBLOCK[mode])setMode('tek');
        OL.refresh();OL.msg('');hostStart(p);
      });
      p.on('error',function(er){
        if(opened)return;
        if(er&&er.type==='unavailable-id'&&tries++<4){try{p.destroy()}catch(x){}return mk()}
        OL.fail(er,p);
      });
    })();
  });
};
OL.join=function(code){
  if(OL.on)return;
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length<4)return OL.msg('Oda kodunu gir.',true);
  var nm=OL.myName();OL.msg('Bağlanılıyor…');
  loadPeer(function(e){
    if(e)return OL.fail({type:'load'});
    var p=new Peer(peerOpts()),done=false,to=null;
    function bad(er){if(done)return;done=true;clearTimeout(to);OL.fail(er,p)}
    p.on('error',bad);
    p.on('open',function(id){
      var c=p.connect('zapgame-'+code,{reliable:true,serialization:'json'});
      to=setTimeout(function(){bad({type:'timeout'})},15000);
      c.on('open',function(){
        if(done)return;done=true;clearTimeout(to);
        OLP=p;OLC=c;OL.on=true;OL.host=false;OL.code=code;OL.selfId=id;OL.q=[];OL.myn=nm;
        c.send({t:'hi',n:nm});
      });
      c.on('data',onGuest);
      c.on('close',function(){if(OL.on)OL.leave('Oda kapandı.')});
      c.on('error',function(){if(OL.on)OL.leave('Bağlantı koptu.')});
    });
  });
};
OL.leave=function(why){
  clearTimeout(OL.dt);
  if(OLC){try{OLC.close()}catch(e){}OLC=null}
  Object.keys(OL.conns).forEach(function(id){try{OL.conns[id].close()}catch(e){}});OL.conns={};OL.pl={};
  if(OLP){try{OLP.destroy()}catch(e){}OLP=null}
  var was=OL.on;OL.on=false;OL.host=false;OL.locked=false;OL.seed=null;OL.players=[];OL.names={};OL.q=[];OL.pend={};
  if(was)reset();
  OL.ui(why);
  if(why)openOnline();
};

function onGuest(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'welcome':OL.hostId=m.host;OL.setRoster(m.players||[]);netMode(m);OL.msg('');openOnline();break;
    case 'roster':OL.setRoster(m.players||[]);break;
    case 'f':OL.apply(m);break;
    case 'go':OL.onGo(m);break;
    case 'mode':netMode(m);break;
    case 'pop':OL.popDo(m.a);break;
    case 'pv':if(m.c&&+m.n>0){OL.vc={ok:+m.c.ok||0,pas:+m.c.pas||0,yeni:+m.c.yeni||0,need:+m.n};OL.popRole()}break;
    case 'gone':OL.drop(m.p);break;
    case 'bye':OL.leave(m.why||'Odadan çıkarıldın.');break;
  }
}
